<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 분석기 PRO</title>
    
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Chart.js CDN 올바른 경로 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- TensorFlow.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
</head>
<body>

<div class="container">
    <h1>🎱 로또 분석기 PRO</h1>

    <!-- 기본 기능 메뉴 -->
    <div class="menu" style="margin-bottom: 20px;">
        <button onclick="autoNumber()">자동번호</button>
        <button onclick="checkWin()">당첨확인</button>
        <button onclick="showStatistics()">통계분석</button>
    </div>

    <!-- 카드형 그룹 UI: [카드 1] 기본 통계 및 빈도 분석 / [카드 2] AI 신경망 딥러닝 분석 -->
    <div class="analysis-cards-grid">
        
        <!-- 카드 1: 기본 통계 및 빈도 분석 그룹 -->
        <div class="analysis-card">
            <div class="analysis-card-header">
                <span>📊</span>
                <h4 class="analysis-card-title" style="color: #0366d6;">기본 통계 및 빈도 분석</h4>
            </div>
            <p class="analysis-card-desc">과거 당첨 회차의 통계적 빈도와 패턴을 기반으로 분석합니다.</p>
            
            <div class="analysis-buttons-flex">
                <button class="btn-module" onclick="hotRecommend()">HOT 번호 분석</button>
                <button class="btn-module" onclick="coldRecommend()">COLD 번호 분석</button>
                <button class="btn-module" onclick="trendRecommend()">출현 트렌드 분석</button>
            </div>
        </div>

        <!-- 카드 2: AI 신경망 딥러닝 분석 그룹 -->
        <div class="analysis-card ai-card">
            <div class="analysis-card-header">
                <span>🤖</span>
                <h4 class="analysis-card-title" style="color: #7c3aed;">AI 신경망 딥러닝 분석</h4>
            </div>
            <p class="analysis-card-desc">TensorFlow.js 기반 딥러닝 모델 학습 및 교차 검증을 수행합니다.</p>
            
            <div class="analysis-buttons-flex">
                <button class="btn-module btn-ai-enhanced" onclick="enhancedAiRecommend()">⚡ 강화 AI 정밀 분석</button>
                <button class="btn-module btn-ai-lstm" onclick="lstmRecommend()">📈 LSTM 시계열 분석</button>
                <button class="btn-module btn-ai-multi" onclick="multiAiComparativeRecommend()">다중 AI 교차 비교 추천</button>
            </div>
        </div>

    </div>

    <!-- 하단 전체 종합 예상 결과 버튼 -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button id="totalBtn" onclick="totalComprehensiveRecommend()" class="btn-total" style="background: #475569; border: none; font-weight: bold; opacity: 0.6; cursor: not-allowed; width: 100%; padding: 14px; border-radius: 12px; color: white;" disabled>🌟 종합 예상 결과 (모든 분석을 완료해 주세요)</button>
    </div>

    <select id="roundSelect"></select>
    <input type="text" id="numbers" placeholder="1,2,3,4,5,6">

    <div id="result"></div>
    <div id="recommend"></div>
    <div id="analysis"></div>

    <canvas id="chart"></canvas>
</div>

<!-- 스크립트 연결 영역 -->
<script src="app.js"></script>
<script src="loadData.js"></script>
<script src="getFrequency.js"></script>
<script src="showRecommend.js"></script>

<script src="autoNumber.js"></script>
<script src="checkWin.js"></script>
<script src="checkWinForNumbers.js"></script>
<script src="hotRecommend.js"></script>
<script src="coldRecommend.js"></script>
<script src="trendRecommend.js"></script>
<script src="showStatistics.js"></script>
<script src="enhancedAiRecommend.js"></script>
<script src="lstmRecommend.js"></script>
<script src="totalComprehensiveRecommend.js"></script>
<script src="multiAiComparativeRecommend.js"></script>
<script src="modelStorage.js"></script>

<!-- PWA 설정 연결 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('서비스 워커 등록 성공:', reg.scope))
        .catch(err => console.log('서비스 워커 등록 실패:', err));
    });
  }
</script>

</body>
</html>
